apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-webapp-deployment
  labels:
    app: dummy-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-webapp
  template:
    metadata:
      labels:
        app: dummy-webapp
    spec:
      terminationGracePeriodSeconds: 2    # Force Kill a pod after 2 sec
      containers:
      - name: webapp
        image: ghcr.io/noizysthlm/sigstore-demo:latest
        imagePullPolicy: Always # Pull image on every deployment
        ports:
        - containerPort: 5000
