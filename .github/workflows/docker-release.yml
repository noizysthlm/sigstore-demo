# https://docs.github.com/en/actions/reference/workflows-and-actions/variables
# https://docs.github.com/en/actions/tutorials/authenticate-with-github_token
# https://github.com/marketplace/actions/cosign-installer

name: container-build-push-sign
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'app/**'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/noizysthlm/sigstore-demo:latest
            ghcr.io/noizysthlm/sigstore-demo:${{ github.sha }}

      - name: install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        run: cosign sign ghcr.io/noizysthlm/sigstore-demo:latest
