# https://kubespec.dev/kyverno/policies.kyverno.io/v1/ImageValidatingPolicy
# https://kyverno.io/docs/policy-types/image-validating-policy/

apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: validate-container-signatures
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30  # must be between 1 and 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    matchPolicy: 'Equivalent' # Equivalent is the Default
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/noizysthlm/sigstore-demo:*"
    - glob: "noizysthlm/sigstore-demo:*"
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/noizysthlm/sigstore-demo/.github/workflows/docker-release.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog: 
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: |
        Image signature verification failed.
        Ensure that the image is signed by https://github.com/noizysthlm/sigstore-demo/.github/workflows/container-build-push-sign@refs/heads/main
        The signature must be recorded in the public Rekor log